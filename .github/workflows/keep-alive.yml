    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Database Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://gdmuvnoilqgpkzagklfq.supabase.co/rest/v1/proker?select=id&limit=1" \
            -H "apikey: sb_publishable_YjPgY5_BZq8mojdqDKFVvw_Z6ih7kkA")
          echo "Status respons Supabase: $STATUS"
          if [ "$STATUS" -ne 200 ]; then exit 1; fi
